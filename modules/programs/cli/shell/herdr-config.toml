onboarding = false

# Per-tab browser sessions (terminal-agent-browser):
# herdr already injects HERDR_TAB_ID / HERDR_PANE_ID / HERDR_WORKSPACE_ID into
# every pane. terminal-browser keys its "current terminal tab" off HERDR_TAB_ID,
# and the terminal-agent-browser wrapper
# (nix-packages homeManagerModules.terminal-agent-browser) derives its
# per-tab session from HERDR_TAB_ID at invocation time -- no shell integration
# and no plugin needed (plugin v1 has no hook into default pane launches, and
# `herdr config check` rejects unknown keys, so there is nothing to set here).
# Same tab shares a session, different tabs are isolated.

[keys]
prefix = "ctrl+g"
new_workspace = "prefix+n"
rename_workspace = "prefix+ctrl+n"
new_tab = "prefix+c"
rename_tab = "prefix+ctrl+c"
split_vertical = "prefix+p"
rename_pane = "prefix+ctrl+p"
next_tab = "ctrl+n"
previous_tab = "ctrl+p"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[experimental]
kitty_graphics = true

[session]
resume_agents_on_restore = true
